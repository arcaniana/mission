<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>어니 혀니 매일 미션</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one screen, two side-by-side columns (어니 | 혀니). Each column has a gold coin header, a thin progress bar, then compact tap rows. */
:root {
  --bg: #eaf3fb;
  --surface: #ffffff;
  --ink: #14263d;
  --muted: #587089;
  --line: #cfdeee;
  --coin: #f2b705;
  --coin-ink: #4d3800;
  --ok: #1b9a68;
  --ok-ink: #ffffff;
  --hl: #2f62e0;
  --hl-ink: #ffffff;
  --font-display: "Jua", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a2a;
    --surface: #172a40;
    --ink: #eaf2fb;
    --muted: #9bb1c7;
    --line: #29425d;
    --coin: #f5c542;
    --coin-ink: #3a2a00;
    --ok: #4cc795;
    --ok-ink: #0b2a1d;
  --hl: #7db2ff;
  --hl-ink: #06213f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a2a;
  --surface: #172a40;
  --ink: #eaf2fb;
  --muted: #9bb1c7;
  --line: #29425d;
  --coin: #f5c542;
  --coin-ink: #3a2a00;
  --ok: #4cc795;
  --ok-ink: #0b2a1d;
  --hl: #7db2ff;
  --hl-ink: #06213f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.4;
  padding-block: 12px 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
/* 화면을 누르다가 글자가 선택되어 '댓글 추가' 창 같은 것이 뜨지 않도록 글자 선택을 막아요 */
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input { -webkit-user-select: text; user-select: text; }
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.top { position: sticky; top: 0; z-index: 30; background: var(--bg); display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px 0 6px; margin-top: -4px; }
.ctop { position: sticky; top: calc(var(--hh, 44px) + var(--wh, 34px)); z-index: 20; background: var(--bg); display: flex; flex-direction: column; gap: 6px; padding-bottom: 6px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(18px, calc((100vw - 116px) / 8.6), 36px); letter-spacing: -0.03em; line-height: 1.2; margin: 0; width: 100%; text-align: center; }
.date { color: var(--muted); font-size: 12px; }

.lock { display: none; background: var(--surface); border: 2px dashed var(--muted); border-radius: 12px; padding: 8px 12px; font-size: 14px; font-weight: 500; text-align: center; }
.lock.show { display: block; }
.lock.free { border-style: solid; border-color: var(--ok); }
.pmhead { margin: 10px 0 6px; min-height: 40px; display: flex; align-items: center; justify-content: center; white-space: pre; background: var(--surface); border: 2px solid var(--ok); border-radius: 12px; padding: 5px 10px; font-size: 13px; font-weight: 500; text-align: center; }
.pmhead.free { border-style: solid; border-color: var(--ok); }
.pmhead b { font-family: var(--font-display); font-weight: 400; font-size: 16px; }
.lock b { font-family: var(--font-display); font-weight: 400; font-size: 17px; }
.week { position: sticky; top: var(--hh, 44px); z-index: 25; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px 5px; padding: 2px 0 4px; }
.wdate { font-family: var(--font-display); font-size: 15px; line-height: 1; margin-right: 4px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.wd { width: 46px; height: 26px; border-radius: 13px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ink); line-height: 1; cursor: pointer; padding: 0; font-family: inherit; background: linear-gradient(90deg, var(--wl, transparent) 50%, var(--wr, transparent) 50%); }
.wd.rest { border-style: dashed; opacity: 0.6; }
.wd.now { border-color: var(--ink); }
.wd.full { color: var(--ok-ink); }
.wd.sel { box-shadow: 0 0 0 2px var(--hl); }
.wdetail { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 8px; font-size: 12px; }
.wdetail .dh { display: flex; justify-content: space-between; gap: 6px; font-weight: 700; margin-bottom: 4px; }
.wdetail .dbg { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 4px; }
.wdetail .db { background: var(--coin); color: var(--coin-ink); border-radius: 999px; padding: 1px 9px; font-weight: 700; }
.wdetail .dg { color: var(--muted); font-weight: 700; margin: 4px 0 2px; }
.wdetail .dl { display: flex; flex-wrap: wrap; gap: 3px; }
.wdetail .dc { border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; color: var(--muted); text-decoration: line-through; opacity: 0.7; }
.wdetail .dc.ok { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); text-decoration: none; opacity: 1; font-weight: 700; }
.grp { margin-top: 14px; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 0 8px 8px; position: relative; list-style: none; }
.grp .gl { display: inline-block; position: relative; top: -11px; margin-bottom: -4px; background: var(--coin); color: var(--coin-ink); border-radius: 999px; padding: 1px 12px; font-size: 12px; font-weight: 700; line-height: 1.6; }
.sbx { margin-top: 6px; border-top: 1.5px dashed var(--line); padding-top: 5px; text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.grp ul.gi { gap: 5px; }
.offbtn { position: absolute; right: 0; top: 50%; transform: translateY(-50%); z-index: 2; font: inherit; font-size: 12px; line-height: 1.2; white-space: nowrap; text-align: center; font-weight: 700; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 3px 7px; min-height: 0; cursor: pointer; }
.offbtn.on { border-color: var(--hl); background: var(--hl); color: var(--hl-ink); }
.offbtn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.offmsg { display: none; background: var(--surface); border: 2px dashed var(--muted); border-radius: 14px; padding: 18px 10px; text-align: center; font-weight: 700; font-size: 15px; line-height: 1.5; }
.card.off .offmsg { display: block; }
.card.off ul.am, .card.off .pmhead, .card.off .amhead, .card.off ul.pm, .card.off .cbar, .card.off .cmeta .st { display: none; }
.mbox .chk { flex-direction: row; align-items: center; gap: 8px; font-size: 14px; padding: 6px 10px; flex: none; border: 2px solid var(--line); border-radius: 12px; }
.mbox .chk input { width: 20px; height: 20px; }
.mbox .chk input.etcnote { flex: 1; min-width: 0; width: auto; height: 32px; font-size: 14px; padding: 0 8px; border: 2px solid var(--line); border-radius: 8px; user-select: text; -webkit-user-select: text; }
.mbox .chk input.numin { width: 84px; height: 32px; font-size: 15px; padding: 0 8px; border: 2px solid var(--line); border-radius: 8px; text-align: right; margin-left: auto; user-select: text; -webkit-user-select: text; }
.mbox .chk .sec { font-weight: 700; }
.wdetail .dinfo { margin-top: 8px; padding-top: 6px; border-top: 1.5px dashed var(--line); font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.wdetail .dinfo b { color: var(--ink); }
.wdetail .dinfo .dv { font-weight: 700; color: var(--ok); }
.setnow { font-size: 14px; }
.setsum { text-align: center; font-weight: 700; font-size: 15px; display: flex; flex-direction: column; gap: 2px; }
.setsum b { color: var(--ok); font-size: 20px; }
.mbox.wide { width: min(100%, 460px); }
.irow { border: 2px solid var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; flex: none; }
.il1 { display: flex; gap: 6px; align-items: center; }
.mbox .il1 input.iname { flex: 1; min-width: 0; font-size: 15px; padding: 0 8px; height: 34px; }
.mbox .il1 input.iname:disabled { opacity: .75; }
.mbox .ibtn { font: inherit; font-weight: 700; font-size: 15px; width: 34px; height: 34px; min-height: 0; padding: 0; border-radius: 8px; border: 2px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; flex: none; }
.mbox .ibtn:disabled { opacity: .3; cursor: default; }
.ifs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mbox .ifld { flex: 1; min-width: 0; font-size: 11px; font-weight: 700; color: var(--muted); gap: 2px; }
.mbox .ifld input { font: inherit; font-size: 14px; width: 100%; min-width: 0; height: 32px; padding: 0 6px; border: 2px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); box-sizing: border-box; user-select: text; -webkit-user-select: text; }
.ichks { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; }
.mbox .ichks label { flex-direction: row; align-items: center; gap: 4px; font-weight: 400; font-size: 12px; }
.mbox .ichks input { width: 16px; height: 16px; }
.itabs { display: flex; gap: 6px; }
.mbox .itabs button { font: inherit; font-weight: 700; font-size: 15px; flex: 1; min-height: 38px; border-radius: 10px; border: 2px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
.mbox .itabs button[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
.mbox .iadd { font: inherit; font-weight: 700; font-size: 15px; min-height: 40px; border-radius: 10px; border: 2px dashed var(--line); background: transparent; color: var(--ink); cursor: pointer; }
.mbox .chk input.etcnote[hidden] { display: none; }
.phd { font-size: 13px; font-weight: 700; padding: 0 4px 3px; }
.phd .num { display: inline-block; min-width: 1.3em; margin-right: 2px; font-family: var(--font-display); font-weight: 400; color: var(--muted); }
.popts { display: flex; flex-direction: column; gap: 5px; }
.wb { margin-left: 2px; font-size: 12px; font-weight: 700; color: var(--ok); }

.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
.card { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.chead {
  background: var(--coin); color: var(--coin-ink);
  border-radius: 14px; padding: 8px 10px;
  display: flex; justify-content: space-between; align-items: baseline; gap: 6px; flex-wrap: wrap;
}
.cname { font-family: var(--font-display); font-size: 22px; line-height: 1.2; }
.chead { align-items: center; }
.cname { margin-right: auto; }
.cright { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.cname, .ctotal { position: relative; top: 0.12em; } /* Jua 글꼴은 글자가 위쪽에 치우쳐 보여서 살짝 내려요 */
.ctotal { font-family: var(--font-display); font-size: 20px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.settle { font: inherit; font-size: 15px; font-weight: 700; color: var(--coin-ink); background: transparent; border: 2px solid var(--coin-ink); border-radius: 999px; padding: 3px 12px; min-height: 36px; cursor: pointer; }
.settle:focus-visible, .srow button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.srow { background: var(--surface); border: 2px solid var(--ink); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
.srow[hidden] { display: none !important; }
.srow .sb { display: flex; gap: 6px; }
.srow button { font: inherit; font-weight: 700; color: var(--ink); background: transparent; border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 12px; min-height: 32px; cursor: pointer; }
.srow .sy { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.bump { animation: bump 0.35s ease-out; display: inline-block; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.15); } 100% { transform: scale(1); } }
.cmeta { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cmeta { align-items: center; flex-wrap: wrap; }
.cmeta b { color: var(--ink); }
.tw { display: inline-flex; align-items: baseline; gap: 4px; background: var(--hl); color: var(--hl-ink); border-radius: 999px; padding: 2px 12px; font-size: 13px; font-weight: 700; }
.tw .today { color: inherit; font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: 1.2; }
.cbar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.cbar > i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 999px; transition: width 0.3s ease; }
.card.all .cmeta .st { color: var(--ok); font-weight: 700; }

ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.task {
  width: 100%;
  min-height: 48px;
  display: grid;
  grid-template-columns: 26px 1fr auto;
  align-items: center;
  gap: 8px;
  text-align: left;
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 5px 8px;
  cursor: pointer;
  position: relative;
  -webkit-tap-highlight-color: transparent;
}
.task:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.box {
  width: 26px; height: 26px; border-radius: 8px;
  border: 2.5px solid var(--muted);
  display: grid; place-items: center;
  color: transparent;
}
.box svg { width: 16px; height: 16px; }
.name { font-size: 13px; font-weight: 500; line-height: 1.3; min-width: 0; overflow-wrap: anywhere; }
.name .num { display: inline-block; min-width: 1.3em; margin-right: 2px; font-family: var(--font-display); font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.name small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.nbox { margin-top: 4px; border: 1.5px dashed var(--muted); border-radius: 8px; padding: 0 8px; font-size: 11px; font-weight: 500; line-height: 1.5; text-align: center; color: var(--muted); }
.pay { font-family: var(--font-display); font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.task[aria-pressed="true"] .pay { color: var(--ok); }
.task[aria-pressed="true"] { border-color: var(--ok); }
.task[aria-pressed="true"] .box { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
.task[aria-pressed="true"] .name { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.task[aria-disabled="true"] { cursor: not-allowed; opacity: 0.55; }
.task[aria-disabled="true"][aria-pressed="true"] { opacity: 0.85; }
.float {
  position: absolute; right: 6px; top: 2px; pointer-events: none;
  font-family: var(--font-display); font-size: 13px; color: var(--coin-ink);
  background: var(--coin); border-radius: 999px; padding: 1px 8px;
  animation: rise 0.8s ease-out forwards;
}
@keyframes rise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-26px); opacity: 0; } }

.confirm {
  font: inherit; font-size: 13px; font-weight: 700; color: var(--ink);
  background: transparent; border: 2px dashed var(--muted); border-radius: 12px;
  min-height: 46px; padding: 6px 8px; cursor: pointer; margin-top: 2px;
  -webkit-tap-highlight-color: transparent;
}
.confirm:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.confirm[aria-pressed="true"] { border-style: solid; border-color: var(--ok); background: var(--ok); color: var(--ok-ink); }
.confirm[aria-pressed="true"]::before { content: "✓ "; }
.card .confirm { margin-top: 6px; }
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(8, 18, 32, 0.55); display: flex; align-items: flex-start; justify-content: center; padding: 12px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.modal[hidden] { display: none; }
.mbox { margin: auto; background: var(--surface); color: var(--ink); border-radius: 18px; padding: 14px; width: min(100%, 360px); display: flex; flex-direction: column; gap: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.35); }
.mbox h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.mbox label { font-size: 13px; font-weight: 700; display: flex; flex-direction: column; gap: 4px; }
.mbox input[type="password"], .mbox input[type="text"] { font: inherit; font-size: 16px; padding: 8px 10px; border: 2px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
.mbox .msg { min-height: 1.2em; font-size: 13px; font-weight: 700; color: #d6402f; }
.mbox .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.mbox .acts button, .step button { font: inherit; font-weight: 700; font-size: 15px; min-height: 44px; padding: 6px 14px; border-radius: 12px; border: 2px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
.mbox .acts .go { flex: 1; background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
.step { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; align-items: center; }
.step .val { text-align: center; font-family: var(--font-display); font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.step .val.plus { color: var(--ok); }
.step .val.minus { color: #d6402f; }
.mbox input[type="range"] { width: 100%; }
.mbox .scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: -6px; }
.foot { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; }
.foot button { font: inherit; color: var(--ink); background: transparent; border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; min-height: 32px; }
.foot button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.foot .danger { border-color: var(--ink); }
.foot .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

/* 폰 화면: 네 글자 이름이 한 줄에 들어가도록 칸을 조금 줄여요 */
@media (max-width: 639px) {
  .task { grid-template-columns: 22px 1fr auto; gap: 5px; padding: 5px 6px; }
  .box { width: 22px; height: 22px; border-width: 2px; border-radius: 7px; }
  .box svg { width: 14px; height: 14px; }
  .name { font-size: 13px; word-break: keep-all; overflow-wrap: normal; }
  .name .num { min-width: 0; margin-right: 3px; }
  .pay { font-size: 12px; }
}
@media (max-width: 420px) {
  .task { gap: 4px; padding: 5px 5px; }
  .name { font-size: 12.5px; }
  .name .num { margin-right: 2px; }
}
@media (max-width: 420px) {
  .chead { flex-wrap: nowrap; padding: 8px 8px; gap: 4px; }
  .cname { font-size: 20px; }
  .ctotal { font-size: 18px; }
  .cright { gap: 4px; }
  .settle { font-size: 13px; padding: 2px 8px; min-height: 32px; }
}
@media (max-width: 380px) {
  .name { font-size: 11.5px; }
  .pay { font-size: 11px; }
  .task { grid-template-columns: 20px 1fr auto; }
  .box { width: 20px; height: 20px; }
}
@media (min-width: 640px) {
  body { font-size: 16px; padding-block: 20px 32px; }
  h1 { font-size: 30px; }
  .date { font-size: 14px; }
  .cols { gap: 16px; }
  .chead { padding: 12px 16px; }
  .cname { font-size: 28px; }
  .ctotal { font-size: 28px; }
  .settle { font-size: 18px; padding: 4px 16px; min-height: 42px; }
  .srow { font-size: 14px; }
  .cmeta { font-size: 14px; }
  .tw { font-size: 16px; padding: 3px 16px; }
  .tw .today { font-size: 30px; }
  .cbar { height: 8px; }
  .wdate { font-size: 18px; margin-right: 4px; }
  .wd { width: 60px; height: 32px; border-radius: 16px; font-size: 14px; }
  .wb { font-size: 15px; }
  .task { min-height: 56px; grid-template-columns: 32px 1fr auto; padding: 8px 12px; gap: 12px; }
  .box { width: 32px; height: 32px; }
  .box svg { width: 20px; height: 20px; }
  .name { font-size: 17px; }
  .name small { font-size: 13px; }
  .pay { font-size: 18px; }
  .nbox { font-size: 14px; padding: 1px 10px; }
  .float { font-size: 16px; }
  .foot { font-size: 14px; }
  .confirm { font-size: 16px; min-height: 52px; }
}
@media (prefers-reduced-motion: reduce) {
  .bump, .float { animation: none; }
  .float { display: none; }
  .cbar > i { transition: none; }
}
</style>

<main class="wrap">
  <header class="top">
    <h1>어니 혀니 매일 미션</h1>
    <button type="button" class="offbtn" id="offbtn">쉬는<br>날</button>
  </header>


  <div class="week" id="week" role="group" aria-label="이번 주 월요일부터 금요일"></div>

  <div class="cols" id="cols"></div>

  <div class="foot">
    <span id="savemsg">이 기기에 저장돼요.</span>
    <button type="button" id="editbtn">미션 편집</button>
    <button type="button" id="paybtn">보너스 설정</button>
    <button type="button" id="syncbtn">시트 연동</button>
    <button type="button" id="pwbtn">비밀번호 설정</button>
  </div>
  <div class="modal" id="modal" hidden></div>
</main>

<script>
(function () {
  var PAY = 1; // 항목 하나의 기본 점수
  var WON = 10; // 1p = 10원
  var SETTLE_STEP = 100; // 정산은 100p 단위로, 최소 100p부터
  var ADJ_MAX = 20, ADJ_STEP = 2; // 부모님이 하루에 더하거나 뺄 수 있는 점수(−20p ~ +20p, 2p 단위)
  var BONUS = 1; // 하루에 모든 항목을 체크하면 받는 보너스
  // 저녁 1~3번(문제·영어·독서)으로 번 돈이 1200p이 될 때마다 300p을 더 줘요. (4일 성공하면 1일 더 성공으로 쳐주는 셈)
  var STUDY_IDS = ["pq", "pe", "pr"];
  var STUDY_STEP = 120;
  var STUDY_BONUS = 30;
  var ALL_BONUS = 5; // 아침·저녁 미션을 모두 체크하면 받는 보너스
  var WEEK_BONUS = 10; // 월~금을 모두 성공한 주에 받는 보너스
  // 쉬는 날은 시간 제한 없이 하루 종일 체크할 수 있어요. 토·일은 자동으로 쉬는 날이고,
  // 공휴일·방학·재량휴업일은 'YYYY-MM-DD' 형식으로 아래에 적어요. (평일 쉬는 날은 주간 보너스 조건에서 빠져요)
  var HOLIDAYS = ["2026-12-25", "2027-01-01"];
  var ITEMS = [
    // from~until: 이 항목을 체크할 수 있는 시간 (한국 시간, 24시간제). 항목마다 따로 바꿀 수 있어요.
    { id: "wake", text: "일어나기", note: "7시 20분까지", from: "07:00", until: "07:20" },
    { id: "meal", text: "아침 먹기", note: "7시 40분까지", from: "07:20", until: "07:40" },
    { id: "brush", text: "양치 세수", from: "07:20", until: "07:55" },
    { id: "lotion", text: "로션", from: "07:25", until: "07:55" },
    { id: "hair", text: "머리 빗기", from: "07:25", until: "07:55" },
    { id: "bottle", text: "가방 확인", from: "07:30", until: "07:55" },
    { id: "watch", text: "워치 차기", from: "07:30", until: "07:55" },
    { id: "coat", text: "외투 입기", from: "07:40", until: "07:55" },
    { id: "greet", text: "인사 하기", note: "7시 55분까지", from: "07:40", until: "07:55" }
  ];
  // 저녁 미션 (한국 시간). 시간은 항목마다 따로 바꿀 수 있어요.
  // grace: 화면에 보이는 마감 시간이 지나도 이 분(分)만큼은 더 체크할 수 있어요.
  var ITEMS_PM = [
    { id: "pq", text: "문제 풀기", pay: 10, from: "18:00", until: "21:00", grace: 10 },
    { id: "pe", text: "영어 공부", pay: 10, from: "18:00", until: "21:00", grace: 10 },
    { id: "pr", text: "독서 하기", pay: 10, from: "18:00", until: "21:00", grace: 10, note: "9시까지" },
    { id: "pt", text: "양치 하기", pay: 1, from: "18:00", until: "21:30", grace: 10 },
    // 세수·샤워는 둘 중 하나만 고를 수 있어요. 어제 세수만 했다면 오늘은 샤워만, 어제 샤워했다면 오늘은 둘 중 선택!
    { id: "pw", text: "세수 하기", pay: 1, from: "18:00", until: "21:30", grace: 10, pair: true, note: "둘 중 하나" },
    { id: "ps", text: "샤워 하기", pay: 3, from: "18:00", until: "21:30", grace: 10, pair: true, note: "9시 30분까지" },
    { id: "pj", text: "♥ 개인 공부", optional: true, pay: 0, payText: "?", from: "18:00", until: "22:00" },
    { id: "pb", text: "자러 가기", pay: 1, from: "18:00", until: "22:00", note: "10시까지" }
  ];
  var ALL = ITEMS.concat(ITEMS_PM);
  // 부모님이 '미션 편집'에서 바꾸기 전의 처음 항목들
  var DEF_AM = JSON.parse(JSON.stringify(ITEMS)), DEF_PM = JSON.parse(JSON.stringify(ITEMS_PM));
  DEF_AM.forEach(function (it) { if (it.pay === undefined) it.pay = PAY; delete it.note; });
  DEF_PM.forEach(function (it) { if (STUDY_IDS.indexOf(it.id) > -1) it.study = true; if (it.pay === undefined) it.pay = PAY; delete it.note; });
  var DEFC = { BONUS: BONUS, ALL_BONUS: ALL_BONUS, WEEK_BONUS: WEEK_BONUS, STUDY_STEP: STUDY_STEP, STUDY_BONUS: STUDY_BONUS };
  var KIDS = [{ id: "eoni", name: "어니" }, { id: "hyeoni", name: "혀니" }];
  var KEY = "morning-checklist-v2";

  // 전체 열리는 시각과 닫히는 시각은 항목별 시간에서 자동으로 정해져요.
  function toMin(s) { var p = s.split(":"); return +p[0] * 60 + +p[1]; }
  function toObj(mins) { return { h: Math.floor(mins / 60), m: mins % 60 }; }
  var OPEN_AT = toObj(Math.min.apply(null, ITEMS.map(function (i) { return toMin(i.from); })));
  var CLOSE_AT = toObj(Math.max.apply(null, ITEMS.map(function (i) { return toMin(i.until); })));

  var PM_OPEN = toObj(Math.min.apply(null, ITEMS_PM.map(function (i) { return toMin(i.from); })));
  var PM_CLOSE = toObj(Math.max.apply(null, ITEMS_PM.map(function (i) { return toMin(i.until) + (i.grace || 0); })));

  function timeText(t) { var p = t.split(":"), h = +p[0], m = +p[1]; return (h > 12 ? h - 12 : h) + "시" + (m ? " " + m + "분" : "") + "까지"; }

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function label(t) { return pad(t.h) + ":" + pad(t.m); }
  function nowMinutes() {
    var d = new Date(Date.now() + 9 * 3600 * 1000);
    return d.getUTCHours() * 60 + d.getUTCMinutes();
  }
  // 날짜 계산 (한국 날짜 'YYYY-MM-DD' 기준)
  function dayMs(k) { var p = k.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function keyOf(ms) { return new Date(ms).toISOString().slice(0, 10); }
  function dateText(k) { return (+k.slice(5, 7)) + "." + (+k.slice(8, 10)) + "."; } // 예: 10.29.
  function dow(k) { return new Date(dayMs(k)).getUTCDay(); } // 0=일, 6=토
  function isRest(k) { var w = dow(k); return w === 0 || w === 6 || HOLIDAYS.indexOf(k) > -1; }
  function mondayOf(k) { return keyOf(dayMs(k) - ((dow(k) + 6) % 7) * 86400000); }
  function weekdaysOf(mon) {
    var a = [];
    for (var i = 0; i < 5; i++) a.push(keyOf(dayMs(mon) + i * 86400000));
    return a;
  }

  function openState(pm) {
    if (isRest(todayKey())) return "open";
    var n = nowMinutes();
    var o = pm ? PM_OPEN : OPEN_AT, c = pm ? PM_CLOSE : CLOSE_AT;
    if (n < o.h * 60 + o.m) return "before";
    if (n > c.h * 60 + c.m) return "after"; // "55분까지"는 55분이 끝날 때까지
    return "open";
  }
  function pairInfo(kid, id) {
    // 세수(pw)·샤워(ps) 선택 규칙. 이미 체크한 항목은 막지 않아요.
    if (id !== "pw" && id !== "ps") return "";
    var ds = state.kids[kid].days, t = todayKey();
    var today = ds[t] || [];
    if (today.indexOf(id) > -1) return "";
    var other = id === "pw" ? "ps" : "pw";
    if (today.indexOf(other) > -1) return "other";
    if (id === "pw") {
      var y = ds[keyOf(dayMs(t) - 86400000)] || [];
      if (y.indexOf("pw") > -1 && y.indexOf("ps") === -1) return "yday";
    }
    return "";
  }
  function canCheck(id, kid) {
    if (kid && pairInfo(kid, id)) return false;
    if (isRest(todayKey())) return true;
    for (var i = 0; i < ALL.length; i++) {
      var it = ALL[i];
      if (it.id === id) {
        var n = nowMinutes();
        return n >= toMin(it.from) && n <= toMin(it.until) + (it.grace || 0);
      }
    }
    return false;
  }

  function todayKey() {
    try { return new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Seoul" }); }
    catch (e) { return new Date().toISOString().slice(0, 10); }
  }
  function load() {
    var p = null;
    try { var raw = localStorage.getItem(KEY); if (raw) p = JSON.parse(raw); } catch (e) {}
    return normalize(p);
  }
  var justMigrated = false;
  // 예전에는 1p = 1원이었어요. 1p = 10원으로 바뀌면서 저장된 점수를 10분의 1로 줄여요.
  function migrate(s) {
    var d10 = function (n) { return Math.round((+n || 0) / 10); };
    KIDS.forEach(function (k) {
      var kd = s.kids[k.id];
      if (!kd) return;
      if (kd.carry) kd.carry = d10(kd.carry);
      if (kd.studyCarry) kd.studyCarry = d10(kd.studyCarry);
      if (kd.adj) Object.keys(kd.adj).forEach(function (d) { kd.adj[d] = d10(kd.adj[d]); });
    });
    var c = s.cfg || {};
    ["BONUS", "ALL_BONUS", "WEEK_BONUS", "STUDY_STEP", "STUDY_BONUS"].forEach(function (k) { if (typeof c[k] === "number") c[k] = d10(c[k]); });
    if (c.pay) Object.keys(c.pay).forEach(function (k) { if (typeof c.pay[k] === "number") c.pay[k] = d10(c.pay[k]); });
    if (c.items) ["am", "pm"].forEach(function (g) { (c.items[g] || []).forEach(function (it) { if (typeof it.pay === "number") it.pay = d10(it.pay); }); });
  }
  function normalize(p) {
    var s = { kids: {} };
    s.cfg = (p && p.cfg) || {};
    if (p && p.kids) { s.kids = p.kids; s.confirmed = p.confirmed || {}; s.pw = p.pw || ""; s.ts = p.ts || 0; }
    KIDS.forEach(function (k) { if (!s.kids[k.id] || !s.kids[k.id].days) s.kids[k.id] = { days: {} }; if (!s.kids[k.id].adj) s.kids[k.id].adj = {}; if (!s.kids[k.id].conf) s.kids[k.id].conf = {}; if (!s.kids[k.id].off) s.kids[k.id].off = {}; });
    if (p && p.kids && !(p.ver >= 2)) { migrate(s); justMigrated = true; }
    s.ver = 2;
    return s;
  }
  function save(quiet) {
    if (!quiet) state.ts = Math.max(Date.now(), (state.ts || 0) + 1);
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    if (!quiet) schedulePush();
  }

  var state = load();
  if (justMigrated) { justMigrated = false; save(); }
  var day = todayKey();
  var valid = ALL.map(function (i) { return i.id; });
  var amIds = ITEMS.map(function (i) { return i.id; });
  function onlyValid(arr) { return (arr || []).filter(function (id) { return valid.indexOf(id) > -1; }); }
  function amOnly(arr) { return onlyValid(arr).filter(function (id) { return amIds.indexOf(id) > -1; }); }
  function payOf(id) { for (var i = 0; i < ALL.length; i++) if (ALL[i].id === id) return ALL[i].pay === undefined ? PAY : ALL[i].pay; return 0; }
  function pmFull(arr) {
    var v = onlyValid(arr);
    return ITEMS_PM.every(function (it) { return it.pair || it.optional || v.indexOf(it.id) > -1; }) && (v.indexOf("pw") > -1 || v.indexOf("ps") > -1);
  }
  function pmCount(arr) {
    var v = onlyValid(arr), n = 0;
    ITEMS_PM.forEach(function (it) { if (!it.pair && !it.optional && v.indexOf(it.id) > -1) n++; });
    return n + (v.indexOf("pw") > -1 || v.indexOf("ps") > -1 ? 1 : 0);
  }
  var PM_TOTAL = ITEMS_PM.filter(function (it) { return !it.pair && !it.optional; }).length + 1;
  applyCfg();
  function dayCoins(arr) {
    var v = onlyValid(arr), n = 0;
    v.forEach(function (id) { n += payOf(id); });
    var am = amOnly(arr).length === ITEMS.length;
    if (am) n += BONUS;
    if (am && pmFull(arr)) n += ALL_BONUS;
    return n;
  }
  function studyDay(arr) {
    var n = 0;
    onlyValid(arr).forEach(function (id) { if (STUDY_IDS.indexOf(id) > -1) n += payOf(id); });
    return n;
  }
  function studyOf(kid) {
    var kd = state.kids[kid], n = kd.studyCarry || 0;
    Object.keys(kd.days).forEach(function (d) { n += studyDay(kd.days[d]); });
    return n;
  }
  // 그 주에 공부 미션(1~3번)을 모두 한 날 수, 그 주에 새로 받은 공부 보너스
  function studyWeek(kid, mon) {
    var kd = state.kids[kid], before = kd.studyCarry || 0, week = 0, full = 0;
    Object.keys(kd.days).forEach(function (d) {
      var v = studyDay(kd.days[d]);
      if (d < mon) before += v;
      else if (mondayOf(d) === mon) {
        week += v;
        var ids = onlyValid(kd.days[d]);
        if (weekdaysOf(mon).indexOf(d) > -1 && STUDY_IDS.length && STUDY_IDS.every(function (id) { return ids.indexOf(id) > -1; })) full++;
      }
    });
    return { days: full, gained: (Math.floor((before + week) / STUDY_STEP) - Math.floor(before / STUDY_STEP)) * STUDY_BONUS };
  }
  function studyBonus(kid) { return Math.floor(studyOf(kid) / STUDY_STEP) * STUDY_BONUS; }
  function daysOf(kid) { return state.kids[kid].days; }
  // 부모님 확인은 어니·혀니 함께 하루에 한 번만 받아요.
  function confOf() {
    if (!state.confirmed) state.confirmed = {};
    return state.confirmed;
  }
  // 그날 부모님이 '쉬는 날'로 정한 날 (체험학습·개인 사정 등)
  function isOff(kid, k) { return !!state.kids[kid].off[k]; }
  function fullDay(kid, k) { return amOnly(daysOf(kid)[k]).length === ITEMS.length; }
  // 그 주 월~금(쉬는 평일 제외)을 모두 성공했는지
  function weekDone(kid, mon) {
    var req = weekdaysOf(mon).filter(function (k) { return HOLIDAYS.indexOf(k) === -1 && !isOff(kid, k); });
    return req.length > 0 && req.every(function (k) { return fullDay(kid, k); });
  }
  function totalCoins(kid) {
    var n = state.kids[kid].carry || 0;
    var adj = state.kids[kid].adj;
    n += studyBonus(kid);
    Object.keys(adj).forEach(function (d) { n += adj[d] || 0; });
    var ds = daysOf(kid);
    var weeks = {};
    Object.keys(ds).forEach(function (d) {
      n += dayCoins(ds[d]);
      var mon = mondayOf(d);
      if (!weeks[mon]) { weeks[mon] = true; if (weekDone(kid, mon)) n += WEEK_BONUS; }
    });
    return n;
  }

  // 지난주(와 그 전) 기록은 합계 금액으로만 합쳐 두고 요일별 기록은 비워요. (이번 주 기록만 요일별로 보여줘요)
  function rollover() {
    var cur = mondayOf(todayKey());
    var limit = keyOf(dayMs(cur) - 7 * 86400000); // 어제 기록(세수·샤워 규칙)이 필요해서 지난주는 한 주 더 남겨 둬요
    var changed = false;
    KIDS.forEach(function (k) {
      var kd = state.kids[k.id], ds = kd.days, weeks = {};
      Object.keys(ds).forEach(function (d) { var m = mondayOf(d); if (m < limit) weeks[m] = true; });
      Object.keys(weeks).forEach(function (m) {
        var sum = weekDone(k.id, m) ? WEEK_BONUS : 0;
        Object.keys(ds).forEach(function (d) { if (mondayOf(d) === m) { sum += dayCoins(ds[d]); kd.studyCarry = (kd.studyCarry || 0) + studyDay(ds[d]); delete ds[d]; } });
        kd.carry = (kd.carry || 0) + sum;
        changed = true;
      });
    });
    KIDS.forEach(function (k) {
      var kd = state.kids[k.id];
      Object.keys(kd.adj).concat(Object.keys(kd.conf), Object.keys(kd.off)).forEach(function (d) {
        if (mondayOf(d) < limit) {
          if (kd.adj[d]) { kd.carry = (kd.carry || 0) + kd.adj[d]; }
          delete kd.adj[d]; delete kd.conf[d]; delete kd.off[d]; changed = true;
        }
      });
    });
    if (changed) save(true);
  }

  function signed(v) { return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v) + "p"; }

  function renderDetail(c, kid, key, today) {
    var box = c.detail;
    if (!key) { box.hidden = true; return; }
    var arr = onlyValid(daysOf(kid)[key]);
    box.hidden = false;
    box.textContent = "";
    var h = document.createElement("div");
    h.className = "dh";
    var a = document.createElement("span");
    a.textContent = dateText(key) + " " + WD_NAMES[weekdaysOf(mondayOf(key)).indexOf(key)];
    var b = document.createElement("span");
    var aj = state.kids[kid].adj[key] || 0;
    b.textContent = isOff(kid, key) ? (state.kids[kid].off[key] === "공휴일" ? "공휴일" : "쉬는 날") + (aj ? " (부모님 " + signed(aj) + ")" : "") : key > today ? "아직이에요" : (dayCoins(arr) + aj).toLocaleString("ko-KR") + "p" + (aj ? " (부모님 " + signed(aj) + ")" : "");
    h.appendChild(a); h.appendChild(b);
    box.appendChild(h);
    if (key <= today && !isOff(kid, key)) {
      var bg = el("div", "dbg");
      var amFull = amOnly(arr).length === ITEMS.length, pmDone = pmFull(arr);
      if (amFull) bg.appendChild(el("span", "db", "아침 올 클리어 +" + BONUS + "p"));
      if (amFull && pmDone) bg.appendChild(el("span", "db", "하루 올 클리어 +" + ALL_BONUS + "p"));
      if (dow(key) === 5) {
        var sw = studyWeek(kid, mondayOf(key));
        if (sw.days >= 4) bg.appendChild(el("span", "db", "공부 미션 " + sw.days + "일 클리어 +" + sw.gained + "p"));
      }
      if (bg.childNodes.length) box.appendChild(bg);
    }
    function group(title, list) {
      var g = document.createElement("div");
      g.className = "dg";
      var cnt = 0;
      var l = document.createElement("div");
      l.className = "dl";
      var pairDone = false;
      list.forEach(function (it) {
        if (it.pair) {
          if (pairDone) return;
          pairDone = true;
          var got = arr.indexOf("pw") > -1 ? "세수" : arr.indexOf("ps") > -1 ? "샤워" : "";
          var e = document.createElement("span");
          e.className = "dc" + (got ? " ok" : "");
          e.textContent = got ? (got + " 하기") : "세수·샤워";
          if (got) cnt++;
          l.appendChild(e);
          return;
        }
        var ok = arr.indexOf(it.id) > -1;
        if (ok && !it.optional) cnt++;
        var e2 = document.createElement("span");
        e2.className = "dc" + (ok ? " ok" : "");
        e2.textContent = it.text;
        l.appendChild(e2);
      });
      var total = list.filter(function (x) { return !x.pair && !x.optional; }).length + (list.some(function (x) { return x.pair; }) ? 1 : 0);
      g.textContent = title + " " + cnt + " / " + total;
      box.appendChild(g);
      box.appendChild(l);
    }
    group("아침 미션", ITEMS);
    group("저녁 미션", ITEMS_PM);
    var info = el("div", "dinfo");
    function line(name, val, desc) {
      var r = el("div", "dir");
      r.appendChild(el("b", "", name + " "));
      r.appendChild(el("span", "dv", val));
      r.appendChild(document.createTextNode(" " + desc));
      info.appendChild(r);
    }

  var SYNC_KEY = "morning-sync-url";

  var syncState = syncUrl ? "wait" : "";
  var pushTimer = null, pushing = false, dirty = false, pulling = false;
  function setSyncText() {
    var t = !syncUrl ? "이 기기에 저장돼요." : syncState === "ok" ? "시트와 연동 중" : syncState === "err" ? "연동 오류 (인터넷 확인)" : "시트 연결 중…";

  function fetchJson(url, opt) {

  function adopt(r) {

  function schedulePush() {

  function push() {
    if (!syncUrl || pushing) { if (pushing) schedulePush(); return; }
    pushing = true;
    var sent = state.ts;
    fetchJson(syncUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ ts: sent, state: state }) })

    go.type = "button";
    go.addEventListener("click", function () {
      if (cur && !pwOk(cur.value)) { msg.textContent = "지금 비밀번호가 맞지 않아요"; return; }
      if (n1.value.length < 4) { msg.textContent = "4자 이상으로 정해 주세요"; return; }
      if (n1.value !== n2.value) { msg.textContent = "새 비밀번호가 서로 달라요"; return; }
      state.pw = hashPw(n1.value);
      save(); closeModal(); render();
      $("pwbtn").textContent = "비밀번호 바꾸기";
    });
    acts.appendChild(go);
    if (state.pw) {
      var off = el("button", "", "비밀번호 없애기");
      off.type = "button";
      off.addEventListener("click", function () {
        if (!pwOk(cur.value)) { msg.textContent = "지금 비밀번호가 맞지 않아요"; return; }
        state.pw = "";
        save(); closeModal();
        $("pwbtn").textContent = "비밀번호 설정";
      });
      acts.appendChild(off);
    }
    var no = el("button", "", "닫기");
    no.type = "button";
    no.addEventListener("click", closeModal);
    acts.appendChild(no);
    box.appendChild(acts);
    (cur || n1).focus();
  }
  $("pwbtn").addEventListener("click", pwDialog);
  $("pwbtn").textContent = state.pw ? "비밀번호 바꾸기" : "비밀번호 설정";

  render();
  // 열리는 시각과 닫히는 시각에 맞춰 화면이 저절로 바뀌도록 20초마다 확인합니다.
  setInterval(render, 20000);
  window.addEventListener("resize", render);
  window.addEventListener("load", render);
})();
</script>
